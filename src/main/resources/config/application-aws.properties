# AWS credentials are supplied at runtime via environment variables (or a secrets manager).
# The previously committed access key and secret key remain in git history and must be
# rotated (revoked/reissued). Empty defaults keep startup working when they are unset.
aws.accesskey=${AWS_ACCESS_KEY_ID:}
aws.secretkey=${AWS_SECRET_ACCESS_KEY:}
aws.bucket=mysaas/customerid/account/date
