# AWS credentials are not stored here. Supply them at runtime via the
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables.
# The previously committed access key remains in git history and must be rotated (revoked/reissued).
aws.accesskey=${AWS_ACCESS_KEY_ID:}
aws.secretkey=${AWS_SECRET_ACCESS_KEY:}
aws.bucket=mysaas/customerid/account/date
