# Jasypt master password must be supplied via the JASYPT_ENCRYPTOR_PASSWORD environment variable
# (or an external config / secrets manager). Never commit it here. Startup fails if it is unset.
# The previously committed value remains in git history and must be rotated (db.password re-encrypted).
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}
server.port=8081